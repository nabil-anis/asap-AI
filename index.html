<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASAP AI | Intelligent Evaluation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --background: #FFFFFF;
        --background-secondary: #F5F5F7;
        --background-tertiary: #E8E8ED;
        --foreground: #1D1D1F;
        --foreground-secondary: #86868B;
        --foreground-tertiary: #A1A1A6;
        --border: #D2D2D7;
        --input: #F5F5F7;
        --ring: #0071E3;
        --accent: #1D1D1F;
        --accent-foreground: #FFFFFF;
        --destructive: #FF3B30;
        --score-high: #34C759;
        --score-medium: #FF9500;
        --score-low: #FF3B30;
      }
      html.dark {
        --background: #000000;
        --background-secondary: #121212;
        --background-tertiary: #1C1C1E;
        --foreground: #F5F5F7;
        --foreground-secondary: #86868B;
        --foreground-tertiary: #424245;
        --border: #2C2C2E;
        --input: #1C1C1E;
        --ring: #0A84FF;
        --accent: #F5F5F7;
        --accent-foreground: #000000;
        --destructive: #FF453A;
        --score-high: #30D158;
        --score-medium: #FF9F0A;
        --score-low: #FF453A;
      }
      body {
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        background-color: var(--background);
        color: var(--foreground);
        overflow-x: hidden;
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .perspective-1000 { perspective: 1000px; }
      .preserve-3d { transform-style: preserve-3d; }
      .rotate-y-180 { transform: rotateY(180deg); }
      .backface-hidden { backface-visibility: hidden; }
      
      .glass {
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            animation: {
              'fade-in': 'fade-in 1.2s cubic-bezier(0.15, 0, 0.5, 1) forwards',
              'slide-up': 'slide-up 1s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'blink': 'blink 1.4s infinite both',
            },
            keyframes: {
              'fade-in': { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              'slide-up': { '0%': { transform: 'translateY(40px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
              'blink': { '0%, 100%': { opacity: '0.2' }, '20%': { opacity: '1' } }
            }
          }
        }
      }
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",

    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
