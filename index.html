<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ASAP AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Apple Light Theme */
        --bg-primary: #FFFFFF;
        --bg-secondary: #F5F5F7; /* System Gray 6 */
        --bg-tertiary: #E5E5EA; /* System Gray 5 */
        
        --fg-primary: #1D1D1F;
        --fg-secondary: #86868B;
        --fg-tertiary: #A1A1A6;
        
        --border: rgba(0, 0, 0, 0.08);
        --border-strong: rgba(0, 0, 0, 0.12);
        
        --accent: #0071E3; /* Apple Classic Blue */
        --accent-hover: #0077ED;
        --accent-fg: #FFFFFF;
        
        --glass-material: rgba(255, 255, 255, 0.72);
        --glass-border: rgba(255, 255, 255, 0.4);
        
        --success: #34C759;
        --warning: #FF9500;
        --danger: #FF3B30;
      }

      html.dark {
        /* Apple Dark Theme */
        --bg-primary: #000000;
        --bg-secondary: #1C1C1E; /* System Gray 6 Dark */
        --bg-tertiary: #2C2C2E; /* System Gray 5 Dark */
        
        --fg-primary: #F5F5F7;
        --fg-secondary: #98989D;
        --fg-tertiary: #636366;
        
        --border: rgba(255, 255, 255, 0.12);
        --border-strong: rgba(255, 255, 255, 0.16);
        
        --accent: #0A84FF; /* Apple Dark Mode Blue */
        --accent-hover: #409CFF;
        --accent-fg: #FFFFFF;
        
        --glass-material: rgba(28, 28, 30, 0.72);
        --glass-border: rgba(255, 255, 255, 0.08);
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", sans-serif;
        background-color: var(--bg-primary);
        color: var(--fg-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior-y: none;
      }
      
      /* Hide Scrollbar but keep functionality */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      
      .glass {
        background: var(--glass-material);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--border);
      }

      .perspective-1000 { perspective: 1000px; }
      .preserve-3d { transform-style: preserve-3d; }
      .rotate-y-180 { transform: rotateY(180deg); }
      .backface-hidden { backface-visibility: hidden; }
      
      input, select, textarea {
        font-family: inherit;
      }
    </style>
     <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              'sans': ['-apple-system', 'BlinkMacSystemFont', 'Inter', 'sans-serif'],
            },
            colors: {
               border: 'var(--border)',
               background: 'var(--bg-primary)',
               foreground: 'var(--fg-primary)',
            },
            animation: {
              'fade-in': 'fade-in 0.4s ease-out forwards',
              'scale-up': 'scale-up 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'slide-up': 'slide-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'blink': 'blink 1.4s infinite both',
            },
            keyframes: {
              'fade-in': {
                'from': { opacity: '0' },
                'to': { opacity: '1' },
              },
              'scale-up': {
                'from': { opacity: '0', transform: 'scale(0.96)' },
                'to': { opacity: '1', transform: 'scale(1)' },
              },
              'slide-up': {
                'from': { transform: 'translateY(16px)', opacity: '0' },
                'to': { transform: 'translateY(0)', opacity: '1' },
              },
              'blink': {
                '0%, 100%': { opacity: '0.2' },
                '20%': { opacity: '1' },
              }
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0"
  }
}
</script>
</head>
  <body class="bg-[--bg-primary] text-[--fg-primary] transition-colors duration-300 selection:bg-[--accent] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
